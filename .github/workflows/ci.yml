name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image, role script and schema as docker-compose.yml, mounted the same way.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nl2sql
          POSTGRES_PASSWORD: nl2sql_admin_dev
          POSTGRES_DB: nl2sql_shop
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nl2sql -d nl2sql_shop"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CI: "true"  # the security suite FAILS (not skips) if the database is unreachable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Load schema + role (what docker-compose mounts into initdb.d)
        run: |
          PGPASSWORD=nl2sql_admin_dev psql -h localhost -p 5433 -U nl2sql -d nl2sql_shop -v ON_ERROR_STOP=1 -f db/ecommerce_schema.sql
          PGPASSWORD=nl2sql_admin_dev psql -h localhost -p 5433 -U nl2sql -d nl2sql_shop -v ON_ERROR_STOP=1 -f db/init_roles.sql
      - name: Seed 50,000 rows (deterministic)
        run: python db/seed_ecommerce.py --checksum
      - name: Lint (new modules)
        run: ruff check src/nl2sql/linker.py src/nl2sql/telemetry.py db/seed_ecommerce.py eval/run_eval.py eval/harness_providers.py eval/render_results.py
      - name: Tests (live-DB security suite + offline unit tests)
        run: pytest tests -q
      - name: Evaluation harness self-check (deterministic, no LLM)
        run: |
          python eval/run_eval.py --provider oracle
          python eval/run_eval.py --provider faulty
