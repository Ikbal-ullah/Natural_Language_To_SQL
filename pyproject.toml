[project]
name = "nl2sql-learn"
version = "1.0.0"
description = "Natural-language-to-SQL over a learning-platform database, with safety and correctness guarantees."
requires-python = ">=3.11"
dependencies = [
  "sqlglot>=25.0,<30",
  "psycopg[binary,pool]>=3.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["exercises"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN"]
ignore = ["ANN401", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001", "E501"]
"demos/*" = ["ANN201", "ANN001", "E501"]
"drills/*" = ["ANN201", "ANN001", "E501"]
"eval/*" = ["E501"]
"db/*" = ["E501"]

[tool.pytest.ini_options]
# exercises/tests is deliberately NOT here: those tests are meant to fail until
# the reader implements the stubs. Run them with `make exercises`.
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
exclude = ["exercises/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["sqlglot.*", "anthropic.*"]
ignore_missing_imports = true
